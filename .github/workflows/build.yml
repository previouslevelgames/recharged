name: Build binaries

on:
  pull_request:
    branches: [stable]
  # A push to stable (a merged release PR) builds the packages once and drafts
  # the release of its version.
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-26.04
            jobs: 4
            gcc: 15
          # Steam Deck: SteamOS 3.7 has glibc 2.40 and the GCC 14 C++ runtime.
          # Ubuntu 24.04 (glibc 2.39) with GCC 14 builds binaries that need
          # nothing newer; the packager checks every binary against SteamOS.
          - platform: steamdeck-x86_64
            runner: ubuntu-24.04
            jobs: 4
            gcc: 14
            package_args: --steamdeck
          - platform: macos-arm64
            runner: macos-15
            jobs: 3
            arch: arm64
          # Intel Macs: cross-compiled on the Apple Silicon runner (same Xcode
          # and deployment target); the macos-15-intel runner built about three
          # times slower. Rosetta runs the x86_64 executable check.
          - platform: macos-x86_64
            runner: macos-15
            jobs: 3
            arch: x86_64
            rust_target: x86_64-apple-darwin
            cmake_args: >-
              -DCMAKE_APPLE_SILICON_PROCESSOR=x86_64
              -DCMAKE_OSX_ARCHITECTURES=x86_64
              -DRust_CARGO_TARGET=x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      # One job per runner core; ccache keeps unchanged objects between runs.
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs }}
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CARGO_TERM_COLOR: always
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_MAXSIZE: 3G
    steps:
      # A pull request builds its head commit, so the version names a commit
      # of main (stable requires up-to-date branches: the files are the same).
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check package boundaries
        run: python -B tests/test_package_build.py
      - name: Install Linux tools
        if: runner.os == 'Linux'
        env:
          GCC_VERSION: ${{ matrix.gcc }}
        run: |
          sudo apt-get update
          sudo apt-get install -y "g++-$GCC_VERSION" cmake ninja-build make tcl pkg-config ccache \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libx11-xcb-dev libegl-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
            libudev-dev libdbus-1-dev libvulkan-dev
          echo "CC=gcc-$GCC_VERSION" >> "$GITHUB_ENV"
          echo "CXX=g++-$GCC_VERSION" >> "$GITHUB_ENV"
          # ubuntu-24.04's apt CMake 3.28 repeats whole-archive libraries when
          # linking; the runner's newer CMake in /usr/local/bin comes first.
          cmake --version
          "g++-$GCC_VERSION" --version
      - name: Install macOS tools
        if: runner.os == 'macOS'
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          # Both macOS packages build on Apple Silicon; x86_64 is cross-compiled.
          test "$(uname -m)" = arm64
          if [ "$MACOS_ARCH" = x86_64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          # Aurora needs std::jthread (Apple Clang 17). Xcode 26 on the macOS 15
          # image keeps the deployment target at macOS 15.
          sudo xcode-select -s /Applications/Xcode_26.3.app
          clang++ --version
          brew install cmake ninja tcl-tk ccache
          echo "$(brew --prefix tcl-tk)/bin" >> "$GITHUB_PATH"
          echo 'CC=clang' >> "$GITHUB_ENV"
          echo 'CXX=clang++' >> "$GITHUB_ENV"
      - name: Select Rust toolchain
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ -n "$RUST_TARGET" ]; then rustup target add "$RUST_TARGET"; fi
          cargo --version
      - name: Prepare pinned dependencies
        run: python tools/setup_dependencies.py --shallow
      # Outside the checkout: an untracked folder there marks the version .dirty.
      # (The runner context is not available in job-level env.)
      - name: Place compiler cache
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      # Restored and saved in separate steps: a failure after the build (such
      # as an upload error) must not discard a cold build's cache.
      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.platform }}-
      # The build's origin (release, test or dev) for the launcher's update check.
      - name: Configure original runtime
        run: >-
          cmake --preset release
          -DBUILD_TESTING=OFF
          -DMSCHARGED_FORMAT_PREPARED_SOURCES=OFF
          -DMSCHARGED_BUILD_CHANNEL=${{ github.event_name == 'pull_request' && 'test' || github.event_name == 'push' && 'release' || 'dev' }}
          -DMSCHARGED_BUILD_REPOSITORY=${{ github.repository }}
          -DMSCHARGED_BUILD_PULL_REQUEST=${{ github.event.pull_request.number || 0 }}
          -DMSCHARGED_BUILD_RUN=${{ github.run_id }}
          -DMSCHARGED_BUILD_TIME=$(date -u +%s)
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.cmake_args }}
      # Only the packaged targets.
      - name: Build original runtime
        run: >-
          cmake --build --preset release --target
          mscharged mscharged_original_frontend_module_us mscharged_original_frontend_module_eu
          mscharged_original_main_credits_module
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true
      # Also after a failed or timed-out build: the next run resumes from it.
      - name: Save compiler cache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Check executable
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          if [ -n "$MACOS_ARCH" ]; then
            for binary in build/release/mscharged \
                build/release/mscharged_original_{frontend_module_us,frontend_module_eu,main_credits_module}.{so,dylib,bundle}; do
              [ -e "$binary" ] || continue
              lipo -archs "$binary"
              test "$(lipo -archs "$binary")" = "$MACOS_ARCH"
            done
          fi
          ./build/release/mscharged --version | tee build/release/ci-version.txt
          grep -F 'original frontend runtime' build/release/ci-version.txt
          ./build/release/mscharged --help
      - name: Package binaries and notices
        run: python tools/package_build.py --build-dir build/release --output-dir build/artifacts ${{ matrix.package_args }}
      # Pull requests to stable upload too, so the packages can be tested
      # before the promotion is merged.
      # Uploaded as the package file itself (no zip around it); the artifact
      # takes the file's name, e.g. mscharged-<version>-<system>-<arch>.tar.gz.
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}
      - name: Upload configure diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: configure-${{ matrix.platform }}-${{ github.sha }}
          path: |
            build/release/CMakeFiles/CMakeConfigureLog.yaml
            build/release/sqlite-generation.log
          if-no-files-found: ignore
          retention-days: 7

  windows-game:
    # Cross-compiled on Linux with the pinned LLVM-MinGW (UCRT, libc++), the
    # same toolchain as cmake/toolchains/llvm-mingw-x86_64.cmake documents.
    name: windows-x86_64
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: always
      LLVM_MINGW: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build make tcl pkg-config xz-utils ccache
      - name: Install pinned LLVM-MinGW
        run: |
          mkdir -p build/toolchain
          curl -fsSL -o build/toolchain/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/${LLVM_MINGW}.tar.xz"
          echo '5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4  build/toolchain/llvm-mingw.tar.xz' \
            | sha256sum -c -
          tar -xJf build/toolchain/llvm-mingw.tar.xz -C build/toolchain
      - name: Select Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnullvm
          cargo --version
      - name: Prepare pinned dependencies
        run: python tools/setup_dependencies.py --shallow
      # Outside the checkout: an untracked folder there marks the version .dirty.
      # (The runner context is not available in job-level env.)
      - name: Place compiler cache
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      # Restored and saved in separate steps: a failure after the build (such
      # as an upload error) must not discard a cold build's cache.
      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-windows-x86_64-${{ github.sha }}
          restore-keys: ccache-windows-x86_64-
      - name: Prepare pinned Windows shader compilers
        run: python tools/setup_windows_graphics.py
      - name: Configure original runtime
        run: >-
          cmake --preset release -B build/windows
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/llvm-mingw-x86_64.cmake
          -DLLVM_MINGW_ROOT="$PWD/build/toolchain/$LLVM_MINGW"
          -DBUILD_TESTING=OFF
          -DMSCHARGED_FORMAT_PREPARED_SOURCES=OFF
          -DMSCHARGED_BUILD_CHANNEL=${{ github.event_name == 'pull_request' && 'test' || github.event_name == 'push' && 'release' || 'dev' }}
          -DMSCHARGED_BUILD_REPOSITORY=${{ github.repository }}
          -DMSCHARGED_BUILD_PULL_REQUEST=${{ github.event.pull_request.number || 0 }}
          -DMSCHARGED_BUILD_RUN=${{ github.run_id }}
          -DMSCHARGED_BUILD_TIME=$(date -u +%s)
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      # Only the packaged targets: some Linux-only diagnostics are not portable.
      - name: Build original runtime
        run: >-
          cmake --build build/windows --target
          mscharged mscharged_original_frontend_module_us mscharged_original_frontend_module_eu
          mscharged_original_main_credits_module
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true
      # Also after a failed or timed-out build: the next run resumes from it.
      - name: Save compiler cache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Check executable
        run: |
          test -f build/windows/mscharged.exe
          "build/toolchain/$LLVM_MINGW/bin/llvm-objdump" -p build/windows/mscharged.exe | grep -F 'DLL Name'
      - name: Package binaries and notices
        run: python tools/package_build.py --build-dir build/windows --output-dir build/artifacts
      # Uploaded as the package file itself (no zip around it); the artifact
      # takes the file's name, e.g. mscharged-<version>-<system>-<arch>.zip.
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/*.zip
          archive: false
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}
      - name: Upload configure diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: configure-windows-x86_64-${{ github.sha }}
          path: |
            build/windows/CMakeFiles/CMakeConfigureLog.yaml
            build/windows/sqlite-generation.log
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows host services
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned LLVM-MinGW
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/toolchain | Out-Null
          $archive = 'build/toolchain/llvm-mingw.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a') {
            throw 'LLVM-MinGW archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath build/toolchain
          (Resolve-Path 'build/toolchain/llvm-mingw-20261006-ucrt-x86_64/bin').Path >> $env:GITHUB_PATH
      - name: Initialize host-test source pins
        run: git submodule update --init --checkout -- extern/mscharged-decomp extern/aurora
      - name: Prepare original SDK headers and message source
        run: python tools/prepare_sources.py --build-dir build/host-sources --clang-format off
      - name: Prepare host SDK headers
        run: python tools/prepare_sources.py --dependency aurora --build-dir build/host-sources
      - name: Configure host service tests
        run: >-
          cmake -S tests/host-platform -B build/host-checks -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-clang
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-clang++
          -DMSCHARGED_PREPARED_BUILD_DIR="${{ github.workspace }}/build/host-sources"
          -DMSCHARGED_PREPARED_CLANG_FORMAT=off
      - name: Build host service tests
        run: cmake --build build/host-checks
      - name: Run host service tests
        run: ctest --test-dir build/host-checks --output-on-failure
      # Native Windows compiler checks of individual host services; the game
      # itself is built by the windows-game job.

  release:
    # Drafts the GitHub release of a stable build whose version is not yet
    # released (tag v<version> on that commit); publish it after a review.
    name: draft release
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
    needs: [build, windows-game]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Find the version to release
        id: version
        run: |
          version=$(sed -n 's/^project(mscharged_port VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A version already tagged or with a (draft) release is not drafted again.
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/v$version" >/dev/null ||
             gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -qx "v$version"; then
            echo "::notice::Version $version is already released or drafted; raise it with tools/bump_version.py for a new release."
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi
      # The packages of this run, uploaded unarchived by the build jobs.
      # skip-decompress keeps the Windows .zip package as a file: the action
      # otherwise unpacks every download served as a zip.
      - uses: actions/download-artifact@v8
        if: steps.version.outputs.draft == 'true'
        with:
          pattern: mscharged-*
          path: release
          merge-multiple: true
          skip-decompress: true
      - name: Write checksums
        if: steps.version.outputs.draft == 'true'
        working-directory: release
        run: |
          ls -la
          test "$(ls *.tar.gz *.zip | wc -l)" -eq 5
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      # Generated notes, then a short pointer for players who land on the
      # release page without the port (the launcher shows the notes too).
      - name: Draft the release
        if: steps.version.outputs.draft == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="v$VERSION" \
            -f target_commitish="$GITHUB_SHA" --jq .body > notes.md
          url="https://github.com/$GITHUB_REPOSITORY/blob/stable/docs"
          cat >> notes.md <<EOF

          ---

          **New here?** Download the package for your system below, unpack it into a folder of its own and start \`mscharged\`. You need your own Mario Strikers Charged disc image (USA R4QE01 revision 1, or Europe R4QP01 revision 1 or 2; ISO or RVZ); no game files are included. Guides: [install]($url/INSTALL.md), [Steam Deck]($url/STEAM_DECK.md), [troubleshooting]($url/TROUBLESHOOTING.md).
          EOF
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Mario Strikers Charged Native Port $VERSION" --notes-file notes.md \
            release/*.tar.gz release/*.zip release/SHA256SUMS

  test-build:
    # Publishes a pull request's packages as the prerelease test-pr<N>-<commit>,
    # so testers download them without a GitHub account and the launcher's Test
    # channel can install them (#50). Each push replaces it; test-builds.yml
    # removes it when the pull request closes. Prereleases never become the
    # latest release.
    name: publish test build
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: [build, windows-game]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_BODY: ${{ github.event.pull_request.body }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mscharged-*
          path: test-build
          merge-multiple: true
          skip-decompress: true
      - name: Write checksums
        working-directory: test-build
        run: |
          ls -la
          test "$(ls *.tar.gz *.zip | wc -l)" -eq 5
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish the prerelease
        run: |
          # A pull request closed meanwhile keeps no test build.
          if [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" != OPEN ]; then
            echo "::notice::Pull request #$PR_NUMBER is no longer open; no test build is published."
            exit 0
          fi
          tag="test-pr$PR_NUMBER-${HEAD_SHA:0:12}"
          {
            echo "Test build of [pull request #$PR_NUMBER]($PR_URL) at commit ${HEAD_SHA:0:12}, to try it before it is released."
            echo "It is replaced by each new push to the pull request and removed when the pull request closes."
            echo
            echo "---"
            echo
            printf '%s\n' "$PR_BODY"
          } > notes.md
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$HEAD_SHA" \
            --title "Test build: $PR_TITLE (#$PR_NUMBER)" --notes-file notes.md \
            test-build/*.tar.gz test-build/*.zip test-build/SHA256SUMS
          # Earlier test builds of this pull request.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | { grep -E "^test-pr$PR_NUMBER-[0-9a-f]+$" || true; } | { grep -vx "$tag" || true; } \
            | while read -r old; do
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
